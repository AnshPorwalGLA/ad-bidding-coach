<!-- templates/dashboard.html -->
<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Ad Bidding Dashboard</title>
  <link rel="stylesheet" href="/static/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="nav-left"><h2>Ad Bidding Coach</h2></div>
    <div class="nav-right"><a href="/">Home</a></div>
  </nav>

  <div class="dashboard-grid">
    <aside class="control-panel">
      <h3>Controls</h3>

      <div class="card">
        <label>Target ROAS (display only)</label>
        <input id="targetRoas" type="number" placeholder="Enter target ROAS" />
      </div>

      <div class="card">
        <label>Train Parameters</label>
        <input id="timesteps" type="number" value="20000" />
        <input id="sampleRows" type="number" value="50000" />
        <button id="btnTrain" class="btn">Start Training</button>
        <div id="trainStatus" class="status small">Idle</div>
      </div>

      <div class="card">
        <label>Evaluation</label>
        <button id="btnEval" class="btn ghost">Run Evaluation</button>
        <div id="evalStatus" class="status small">Idle</div>
      </div>

      <div class="card">
        <label>Upload CSV</label>
        <input id="fileInput" type="file" accept=".csv" />
        <button id="btnUpload" class="btn">Upload</button>
      </div>

      <div class="card stats-card">
        <h4>Dataset Summary</h4>
        <p>Rows: <span id="statRows">-</span></p>
        <p>Avg CTR: <span id="statCtr">-</span></p>
        <p>Avg CVR: <span id="statCvr">-</span></p>
        <p>Total Spend: <span id="statSpend">-</span></p>
        <p>Total Revenue: <span id="statRevenue">-</span></p>
      </div>
    </aside>

    <section class="visual-panel">
      <div class="top-cards">
        <div class="metric-card">
          <h4>Target ROAS</h4>
          <div id="targetValue" class="metric-number">-</div>
        </div>
        <div class="metric-card">
          <h4>Achieved ROAS</h4>
          <div id="achievedValue" class="metric-number">-</div>
        </div>
        <div class="metric-card">
          <h4>Total Spend</h4>
          <div id="spendValue" class="metric-number">-</div>
        </div>
        <div class="metric-card">
          <h4>Total Revenue</h4>
          <div id="revenueValue" class="metric-number">-</div>
        </div>
      </div>

      <div class="chart-card">
        <canvas id="spendRevenueChart"></canvas>
      </div>

      <div class="chart-card small">
        <canvas id="ctrChart"></canvas>
      </div>
    </section>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
